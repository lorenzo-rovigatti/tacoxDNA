[project]
name = "tacoxdna"
version = "1.1.0"
description = "A collection of tools for DNA modelling"
readme = "README.md"
authors = [
    { name = "lorenzo-rovigatti", email = "lorenzo.rovigatti@gmail.com" },
    { name = "ohenrich"},
    { name = "Akodiat"},
    { name = "bensonbits"},
    { name = "antonio-suma"},
    { name = "dom-the-physicist"},
    { name = "sdouglas"},
    { name = "lrussel676"},
    { name = "RodenLuo"},
    { name = "elija-feigl"},
    { name = "mckwxp"},
    { name = "mattaq31"},
    { name = "macsandel", email = "mac.sandel@radiancetech.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "scadnano>=0.21.1",
]

[project.scripts]
cadnano_oxDNA = "tacoxdna.cadnano_oxDNA"
CanDo_oxDNA = "tacoxDNA.CanDo_oxDNA:main"
LAMMPS_oxDNA = "tacoxDNA.LAMMPS_oxDNA:main"
oxDNA_LAMMPS = "tacoxDNA.oxDNA_LAMMPS:main"
oxDNA_PDB = "tacoxDNA.oxDNA_PDB:main"
PDB_oxDNA = "tacoxDNA.PDB_oxDNA:main"
rpoly_oxDNA = "tacoxDNA.rpoly_oxDNA:main"
scadnano_oxDNA = "tacoxDNA.scadnano_oxDNA:main"
Tiamat_oxDNA = "tacoxDNA.Tiamat_oxDNA:main"
vHelix_oxDNA = "tacoxDNA.vHelix_oxDNA:main"
XYZ_oxDNA = "tacoxDNA.XYZ_oxDNA:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
